# Logstash pipeline for the Security Log Monitor (the L of the ELK Stack).
# The monitor posts batches of log events and alerts (Elastic Common Schema fields) to this HTTP input.
# Logstash adds map locations for each outside address from its GeoIP database, then stores the documents
# in Elasticsearch. Started by elk\start-windows.ps1.
input {
  http {
    host => "127.0.0.1"
    port => 5080
    codec => json           # a JSON array becomes one event per element
  }
}

filter {
  # where each document goes, sent by the monitor; kept out of the stored document
  mutate {
    add_field => { "[@metadata][index]" => "%{seclog_index}" "[@metadata][id]" => "%{seclog_id}" }
    remove_field => [ "seclog_index", "seclog_id", "@version", "http", "url", "user_agent", "[host][ip]", "[event][original]" ]
  }
  if [source][ip] {
    geoip {
      source => "[source][ip]"
      target => "source"     # fills source.geo: country, city, region and location (latitude and longitude)
      tag_on_failure => []    # private and unknown addresses simply get no location
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://127.0.0.1:9200"]
    index => "%{[@metadata][index]}"
    document_id => "%{[@metadata][id]}"
    manage_template => false  # the monitor installs the index templates itself
    data_stream => false
  }
}
